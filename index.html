<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Level Alarm Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>💧 Water Level Alarm</h1>
        <p>Water Tank Monitoring System</p>
    </header>

    <main class="dashboard">

        <section class="tank-section">
            <h2>Water Tank</h2>

            <div class="tank">
                <div class="water" id="water"></div>
            </div>

            <h3 id="percentage">0%</h3>
            <p>Current Water Level</p>
        </section>

        <section class="control-section">
            <h2>Control Panel</h2>

            <label for="level">Adjust Water Level</label>
            <input type="range" id="level"
                   min="0" max="100" value="0">

            <h3>Status: <span id="status">LOW</span></h3>

            <h3>Alarm: <span id="alarm">OFF</span></h3>

            <button id="reset">Reset Tank</button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
